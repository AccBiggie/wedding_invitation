# Deploy na VPS a cada merge na branch production (ou manual, em Actions > Deploy > Run workflow).
# Segredos do repositorio: VPS_HOST, VPS_USER (deploy), VPS_SSH_KEY (chave privada do CI),
# VPS_KNOWN_HOSTS (saida de  ssh-keyscan -t ed25519 <host> ) e, opcional, VPS_PORT.
# Variavel do repositorio: SITE_URL (ex.: https://seu-dominio.com.br).
name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Chave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Atualizar e subir a versao da production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        # Atualiza o codigo (descartando alteracoes manuais na VPS) antes de chamar o script.
        run: ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'cd /opt/wedding && git fetch -q origin production && git checkout -q -f -B production origin/production && bash deploy/deploy.sh'
      - name: Conferir o site no ar
        if: vars.SITE_URL != ''
        run: |
          for i in $(seq 1 20); do
            curl -fsS "${{ vars.SITE_URL }}/api/health" && exit 0
            sleep 6
          done
          echo "::error::${{ vars.SITE_URL }}/api/health nao respondeu."; exit 1
