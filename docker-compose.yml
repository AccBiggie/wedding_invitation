services:
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["3002:80"]
    depends_on: [backend]
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ["3001:3000"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017/wedding_invitations
      PORT: 3000
      FRONTEND_URL: http://localhost:3002
    depends_on: [mongodb]
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongodb_data:/data/db]
volumes:
  mongodb_data:
