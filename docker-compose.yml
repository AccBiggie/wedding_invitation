services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports: ["3002:80"]
    depends_on: [backend]
  backend:
    build: ./backend
    restart: unless-stopped
    ports: ["${API_PORT:-3001}:3000"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017/wedding_invitations
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3002}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      IMAGE_WEBP_QUALITY: ${IMAGE_WEBP_QUALITY:-80}
    depends_on: [mongodb]
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongodb_data:/data/db]
volumes:
  mongodb_data:
