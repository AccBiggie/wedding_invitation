server {
  listen 80;
  client_max_body_size 11m;
  root /usr/share/nginx/html;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # DNS interno do Docker, consultado de novo a cada 10 s: se o backend for recriado e mudar de
  # IP, o nginx acompanha (com o nome fixo no proxy_pass ele guardaria o IP antigo e daria 502).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:3000;
  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Arquivos com hash no nome (gerados pelo Vite): cache longo.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # A raiz abre o site do casamento; o painel fica em /dashboard. Location relativo
  # (absolute_redirect off): atras do Caddy, o nginx montaria a URL com http://.
  absolute_redirect off;
  location = / {
    return 302 /casamento;
  }
  # O index.html nunca fica em cache, para cada deploy aparecer na hora.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
