# Producao (VPS). Uso: docker compose -f docker-compose.prod.yml up -d --build
# As variaveis vem do .env ao lado deste arquivo (modelo em .env.production.example).
# So o Caddy expoe portas (80/443, com HTTPS automatico); backend e banco ficam na rede interna.
name: wedding

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Sites de outros projetos da VPS (importados no fim do Caddyfile)
      - /opt/caddy-sites:/etc/caddy/sites:ro
    depends_on: [frontend]
    # Rede edge (com IPv6): o Caddy recebe o IP real de cada celular, tambem por IPv6.
    # Rede proxy: alcanca os sites dos outros projetos da VPS.
    networks: [edge, proxy]
    logging: *logging

  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: /api }
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    networks: [edge, default]
    logging: *logging

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 2
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:?defina MONGO_ROOT_USER no .env}:${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD no .env}@mongodb:27017/wedding_invitations?authSource=admin
      FRONTEND_URL: https://${DOMAIN:?defina DOMAIN no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      IMAGE_WEBP_QUALITY: ${IMAGE_WEBP_QUALITY:-80}
      PUBLIC_READ_LIMIT: ${PUBLIC_READ_LIMIT:-2000}
    depends_on:
      mongodb: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  mongodb:
    # 8.2: a 8.0 se recusa a subir em kernel 6.19+ (SERVER-121912), como o 7.0 da VPS.
    image: mongo:8.2
    restart: unless-stopped
    # Banco pequeno: 0,5 GB de cache basta e deixa a RAM para o resto. --auth exige usuario e senha.
    command: ["--auth", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      # So criam o usuario num volume vazio (VPS nova). Num banco existente, crie antes: bash deploy/mongo-create-user.sh
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?defina MONGO_ROOT_USER no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD no .env}
    volumes: [mongodb_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  # Backup diario do banco em ./backups (mantem 14 dias). Restaurar: ver deploy/restore.sh.
  # Copia externa no R2: servico backup-offsite, logo abaixo.
  backup:
    image: mongo:8.2
    restart: unless-stopped
    depends_on:
      mongodb: { condition: service_healthy }
    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USER:?defina MONGO_ROOT_USER no .env}:${MONGO_ROOT_PASSWORD:?defina MONGO_ROOT_PASSWORD no .env}@mongodb:27017/wedding_invitations?authSource=admin
    volumes: ["./backups:/backups"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          mongodump --uri="$$MONGO_URI" --gzip --archive=/backups/wedding-$$(date +%F).archive.gz && echo "backup ok $$(date)"
          find /backups -name 'wedding-*.archive.gz' -mtime +14 -delete
          sleep 86400
        done
    logging: *logging

  # Copia os backups para um bucket do R2 so de backups (fora da VPS). Desligado sem BACKUP_R2_*.
  backup-offsite:
    build: ./backend
    restart: unless-stopped
    command: ["node", "scripts/offsite-backup.js"]
    environment:
      BACKUP_R2_ACCOUNT_ID: ${BACKUP_R2_ACCOUNT_ID:-}
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:-}
      BACKUP_R2_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:-}
      BACKUP_R2_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:-}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:-}
    volumes: ["./backups:/backups:ro"]
    logging: *logging

networks:
  # Sem IPv6 na rede do Docker, o acesso por IPv6 chega pelo docker-proxy e todos os
  # visitantes aparecem com o mesmo IP (o do gateway), dividindo o limite de requisicoes.
  edge:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd4d:6169:6c00:1::/64
  default: {}
  # Compartilhada com os outros projetos da VPS; criada pelo deploy.sh (sub-rede fixa 172.30.250.0/24)
  proxy:
    external: true
    name: proxy

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:
